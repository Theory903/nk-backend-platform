# Feature → resource manifest for post-gen pruning.
# Cookiecutter renders Jinja in `enabled` (and paths) before post_gen runs.
# post_gen deletes resources when enabled.lower() != "true".
# Prefer a single owning feature per resource; REST/GraphQL may still list
# transport-specific routes so the wrong API type is pruned.
# Combined flags: avoid Jinja `or` on stringy bools — use one primary Builder flag.

# ---------------------------------------------------------------------------
# API surface
# ---------------------------------------------------------------------------

[[features]]
name = "GraphQL API"
enabled = "{{cookiecutter.api_type == 'graphql'}}"
resources = ["{{cookiecutter.project_name}}/web/gql"]

[[features]]
name = "REST API"
enabled = "{{cookiecutter.api_type == 'rest'}}"
resources = [
  "{{cookiecutter.project_name}}/web/api/rabbit",
  "{{cookiecutter.project_name}}/web/api/dummy",
  "{{cookiecutter.project_name}}/web/api/echo",
  "{{cookiecutter.project_name}}/web/api/redis",
  "{{cookiecutter.project_name}}/web/api/kafka",
  "{{cookiecutter.project_name}}/web/api/nats"
]

[[features]]
name = "Example routes"
enabled = "{{cookiecutter.enable_routers}}"
resources = [
  "{{cookiecutter.project_name}}/web/api/echo",
  "{{cookiecutter.project_name}}/web/gql/echo",
  "tests/test_echo.py"
]

