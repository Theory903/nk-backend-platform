stages:
  - quality

# Light parity with generated-project GitHub Actions (quality only).
# Full compose pytest + prod image build run in .github/workflows/tests.yml.
# Cookiecutter profile-matrix lives in the generator repo CI, not here.

.quality-template:
  stage: quality
  image: ghcr.io/astral-sh/uv:0.9.12-python3.13-bookworm-slim@sha256:4fa588752732ba29cbfb68ad4e43ece65e54b9b9211003224abab1b1874084ee
  tags:
    - kubernetes-runner
    - docker-runner
  except:
    - tags
  before_script:
    - apt update && apt install -y git
    - uv sync --locked
    - uv lock --check

quality:
  extends:
    - .quality-template
  script:
    - uv run ruff format --check .
    - uv run ruff check .
    - uv run mypy {{cookiecutter.project_name}} tests
    - uv run bandit -r {{cookiecutter.project_name}} -ll -ii
