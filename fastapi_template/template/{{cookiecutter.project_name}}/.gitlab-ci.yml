stages:
  - quality

# Light parity with generated-project GitHub Actions (quality only).
# Full compose pytest + prod image build run in .github/workflows/tests.yml.
# Cookiecutter profile-matrix lives in the generator repo CI, not here.

.quality-template:
  stage: quality
  image: ghcr.io/astral-sh/uv:0.9.12-python3.13-bookworm-slim
  tags:
    - kubernetes-runner
    - docker-runner
  except:
    - tags
  before_script:
    - apt update && apt install -y git
    # Template may lack uv.lock until post-gen; prefer --locked when present.
    - |
      if [ -f uv.lock ]; then
        uv sync --locked
      else
        echo "NOTE: uv.lock missing — unlocked uv sync"
        uv sync
      fi

quality:
  extends:
    - .quality-template
  script:
    - uv run ruff format --check .
    - uv run ruff check .
    - uv run mypy {{cookiecutter.project_name}} tests
