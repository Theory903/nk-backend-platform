# Production overlay — prod image target, no host ports for infra, no source mounts.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Required: set DB_ADMIN_USER / DB_ADMIN_PASSWORD, DB_USER / DB_PASSWORD /
# DB_NAME (and RABBITMQ_* if enabled) via
# env or secret manager. Do not rely on compose `:-` bootstrap defaults in prod.
#
# Edge proxy: not defined here. Put Traefik/nginx (or a cloud LB) in front and
# publish only :80/:443. Keep api on the internal `app` network; Traefik labels
# (if generated with traefik_labels) expect an external Traefik on traefik-shared.
#
# Operators must provide the edge proxy, external secret injection, and
# broker TLS/SASL policy appropriate for their environment.

services:
  api:
    build:
      target: prod
    environment:
      {{cookiecutter.project_name | upper}}_RELOAD: "False"
      {{cookiecutter.project_name | upper}}_ENVIRONMENT: "prod"
      {{cookiecutter.project_name | upper}}_ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      {{cookiecutter.project_name | upper}}_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-[]}
      {{cookiecutter.project_name | upper}}_SECURE_COOKIES: "True"
      {%- if cookiecutter.db_info.name != "none" and cookiecutter.db_info.name != "sqlite" %}
      {{cookiecutter.project_name | upper}}_DB_USER: ${DB_USER:?DB_USER is required}
      {{cookiecutter.project_name | upper}}_DB_PASS: ${DB_PASSWORD:?DB_PASSWORD is required}
      {{cookiecutter.project_name | upper}}_DB_BASE: ${DB_NAME:?DB_NAME is required}
      {%- endif %}
      {%- if cookiecutter.add_users in [True, "True", "true", 1, "1"] %}
      {{cookiecutter.project_name | upper}}_USERS_SECRET: ${USERS_SECRET:?USERS_SECRET is required}
      {{cookiecutter.project_name | upper}}_AUTH_STORE_BACKEND: ${AUTH_STORE_BACKEND:?AUTH_STORE_BACKEND is required}
      {%- endif %}
      {%- if cookiecutter.enable_redis in [True, "True", "true", 1, "1"] %}
      {{cookiecutter.project_name | upper}}_REDIS_PASS: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      {%- endif %}
      {%- if cookiecutter.enable_rmq in [True, "True", "true", 1, "1"] %}
      {{cookiecutter.project_name | upper}}_RABBIT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      {{cookiecutter.project_name | upper}}_RABBIT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      {%- endif %}
    # No ports: reach API via edge proxy on the Docker network (service DNS: api:8000).

  {%- if cookiecutter.enable_taskiq in [True, "True", "true", 1, "1"] %}

  taskiq-worker:
    build:
      target: prod
    environment:
      {{cookiecutter.project_name | upper}}_RELOAD: "False"
      {{cookiecutter.project_name | upper}}_ENVIRONMENT: "prod"
      {{cookiecutter.project_name | upper}}_ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      {{cookiecutter.project_name | upper}}_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-[]}
      {%- if cookiecutter.db_info.name != "none" and cookiecutter.db_info.name != "sqlite" %}
      {{cookiecutter.project_name | upper}}_DB_USER: ${DB_USER:?DB_USER is required}
      {{cookiecutter.project_name | upper}}_DB_PASS: ${DB_PASSWORD:?DB_PASSWORD is required}
      {{cookiecutter.project_name | upper}}_DB_BASE: ${DB_NAME:?DB_NAME is required}
      {%- endif %}
      {%- if cookiecutter.add_users in [True, "True", "true", 1, "1"] %}
      {{cookiecutter.project_name | upper}}_USERS_SECRET: ${USERS_SECRET:?USERS_SECRET is required}
      {{cookiecutter.project_name | upper}}_AUTH_STORE_BACKEND: ${AUTH_STORE_BACKEND:?AUTH_STORE_BACKEND is required}
      {%- endif %}
      {%- if cookiecutter.enable_redis in [True, "True", "true", 1, "1"] %}
      {{cookiecutter.project_name | upper}}_REDIS_PASS: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      {%- endif %}
      {%- if cookiecutter.enable_rmq in [True, "True", "true", 1, "1"] %}
      {{cookiecutter.project_name | upper}}_RABBIT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      {{cookiecutter.project_name | upper}}_RABBIT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      {%- endif %}
  {%- endif %}

  {%- if cookiecutter.db_info.name == "postgresql" %}
  db:
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:?DB_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_RUNTIME_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_RUNTIME_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_OWNER_ROLE: ${DB_OWNER_ROLE:?DB_OWNER_ROLE is required}
  {%- elif cookiecutter.db_info.name == "mongodb" %}
  db:
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:?DB_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  {%- elif cookiecutter.db_info.name == "mysql" %}
  db:
    environment:
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
  {%- endif %}

  {%- if cookiecutter.enable_redis in [True, "True", "true", 1, "1"] %}
  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  {%- endif %}

  {%- if cookiecutter.enable_rmq in [True, "True", "true", 1, "1"] %}
  rmq:
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
  {%- endif %}

  {%- if cookiecutter.enable_kafka in [True, "True", "true", 1, "1"] %}
  kafka:
    environment:
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  {%- endif %}

  {%- if cookiecutter.enable_migrations in [True, "True", "true", 1, "1"] and cookiecutter.orm != 'psycopg' %}

  migrator:
    build:
      target: prod
    environment:
      {{cookiecutter.project_name | upper}}_ENVIRONMENT: "prod"
      {%- if cookiecutter.db_info.name != "none" and cookiecutter.db_info.name != "sqlite" %}
      {{cookiecutter.project_name | upper}}_DB_USER: ${DB_ADMIN_USER:?DB_ADMIN_USER is required}
      {{cookiecutter.project_name | upper}}_DB_PASS: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD is required}
      {{cookiecutter.project_name | upper}}_DB_BASE: ${DB_NAME:?DB_NAME is required}
      {%- endif %}
  {%- endif %}
