# Base Compose topology (production-oriented defaults).
#
# Dev:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# OTel: add -f deploy/docker-compose.otlp.yml
#
# State model (keep this distinction explicit):
#   PostgreSQL / MongoDB / MySQL  — durable identity & business truth
#   Redis                         — ephemeral / distributed state (cache, locks,
#                                   rate limits, short-lived sessions) unless you
#                                   deliberately design Redis as authoritative
#   Kafka / NATS / RabbitMQ       — async / event workloads
#
# Only the edge proxy should be publicly reachable. DB/Redis/brokers stay on the
# internal `app` network; host ports live in docker-compose.dev.yml only.
#
# Next (not bundled): Traefik/nginx edge, Docker/K8s secrets, TLS/SASL for
# brokers, and durable stores for in-memory identity/session primitives.

x-app-common: &app-common
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  networks:
    - app

x-app-environment: &app-environment
  {{cookiecutter.project_name | upper }}_HOST: 0.0.0.0
  {%- if cookiecutter.db_info.name != "none" %}
  {%- if cookiecutter.db_info.name == "sqlite" %}
  {{cookiecutter.project_name | upper }}_DB_FILE: /db_data/db.sqlite3
  {%- else %}
  {{cookiecutter.project_name | upper}}_DB_HOST: db
  {{cookiecutter.project_name | upper}}_DB_PORT: {{cookiecutter.db_info.port}}
  {{cookiecutter.project_name | upper}}_DB_USER: ${DB_USER:-{{cookiecutter.project_name}}}
  {{cookiecutter.project_name | upper}}_DB_PASS: ${DB_PASSWORD:-{{cookiecutter.project_name}}}
  {%- if cookiecutter.db_info.name == "mongodb" %}
  {{cookiecutter.project_name | upper}}_DB_BASE: ${DB_NAME:-admin}
  {%- else %}
  {{cookiecutter.project_name | upper}}_DB_BASE: ${DB_NAME:-{{cookiecutter.project_name}}}
  {%- endif %}
  {%- endif %}
  {%- endif %}
  {%- if cookiecutter.enable_rmq == 'True' %}
  {{cookiecutter.project_name | upper }}_RABBIT_HOST: rmq
  {{cookiecutter.project_name | upper }}_RABBIT_USER: ${RABBITMQ_USER:-guest}
  {{cookiecutter.project_name | upper }}_RABBIT_PASS: ${RABBITMQ_PASSWORD:-guest}
  {%- endif %}
  {%- if cookiecutter.enable_redis == 'True' %}
  {{cookiecutter.project_name | upper }}_REDIS_HOST: redis
  {%- endif %}
  {%- if cookiecutter.enable_kafka == "True" %}
  {{cookiecutter.project_name | upper }}_KAFKA_BOOTSTRAP_SERVERS: '["kafka:9092"]'
  {%- endif %}
  {%- if cookiecutter.enable_nats == "True" %}
  {{cookiecutter.project_name | upper }}_NATS_SERVERS: '["nats://nats:4222"]'
  {%- endif %}

services:
  api:
    <<: *app-common
    build:
      context: .
      target: prod
      dockerfile: ./Dockerfile
    image: {{cookiecutter.project_name}}:{{"${" }}{{cookiecutter.project_name | upper }}_VERSION:-latest{{"}"}}
    environment:
      <<: *app-environment
    {%- if cookiecutter.traefik_labels == "True" %}
    labels:
      - traefik.enable=true
      - traefik.http.routers.{{cookiecutter.project_name}}.rule=Host(`{{ "${" }}{{cookiecutter.project_name | upper}}_TRAEFIK_HOST:-{{cookiecutter.project_name}}.localhost{{ "}" }}`)
      - traefik.http.routers.{{cookiecutter.project_name}}.entrypoints=http
      - traefik.http.routers.{{cookiecutter.project_name}}.service={{cookiecutter.project_name}}
      - traefik.http.services.{{cookiecutter.project_name}}.loadbalancer.server.port={{ "${" }}{{cookiecutter.project_name | upper}}_PORT:-8000{{ "}" }}
    networks:
      - app
      - traefik-shared
    {%- endif %}
    {%- if ((cookiecutter.db_info.name != "none" and cookiecutter.db_info.name != "sqlite") or
            (cookiecutter.enable_redis == "True") or
            (cookiecutter.enable_rmq == "True") or
            (cookiecutter.enable_kafka == "True") or
            (cookiecutter.enable_nats == "True")
    ) %}
    depends_on:
      {%- if cookiecutter.db_info.name != "none" %}
      {%- if cookiecutter.db_info.name != "sqlite" %}
      db:
        condition: service_healthy
      {%- endif %}
      {%- endif %}
      {%- if cookiecutter.enable_redis == "True" %}
      redis:
        condition: service_healthy
      {%- endif %}
      {%- if cookiecutter.enable_rmq == "True" %}
      rmq:
        condition: service_healthy
      {%- endif %}
      {%- if cookiecutter.enable_kafka == "True" %}
      kafka:
        condition: service_healthy
      {%- endif %}
      {%- if cookiecutter.enable_nats == "True" %}
      nats:
        condition: service_healthy
      {%- endif %}
      {%- if cookiecutter.enable_migrations == 'True' and cookiecutter.orm != 'psycopg' %}
      migrator:
        condition: service_completed_successfully
      {%- endif %}
    {%- endif %}
    {%- if cookiecutter.db_info.name == "sqlite" %}
    volumes:
      - {{cookiecutter.project_name}}-db-data:/db_data/
    {%- endif %}

  {%- if cookiecutter.enable_taskiq == "True" %}

  # Worker shares build/env/network via x-app-common only — not API ports/labels/mounts.
  taskiq-worker:
    <<: *app-common
    build:
      context: .
      target: prod
      dockerfile: ./Dockerfile
    image: {{cookiecutter.project_name}}:{{"${" }}{{cookiecutter.project_name | upper }}_VERSION:-latest{{"}"}}
    environment:
      <<: *app-environment
    command:
      - taskiq
      - worker
      - {{cookiecutter.project_name}}.tkq:broker
    {%- if ((cookiecutter.db_info.name != "none" and cookiecutter.db_info.name != "sqlite") or
            (cookiecutter.enable_redis == "True") or
            (cookiecutter.enable_rmq == "True") or
            (cookiecutter.enable_kafka == "True") or
            (cookiecutter.enable_nats == "True")
    ) %}
    depends_on:
      {%- if cookiecutter.db_info.name != "none" %}
      {%- if cookiecutter.db_info.name != "sqlite" %}
      db:
        condition: service_healthy
      {%- endif %}
      {%- endif %}
      {%- if cookiecutter.enable_redis == "True" %}
      redis:
        condition: service_healthy
      {%- endif %}
      {%- if cookiecutter.enable_rmq == "True" %}
      rmq:
        condition: service_healthy
      {%- endif %}
      {%- if cookiecutter.enable_kafka == "True" %}
      kafka:
        condition: service_healthy
      {%- endif %}
      {%- if cookiecutter.enable_nats == "True" %}
      nats:
        condition: service_healthy
      {%- endif %}
      {%- if cookiecutter.enable_migrations == 'True' and cookiecutter.orm != 'psycopg' %}
      migrator:
        condition: service_completed_successfully
      {%- endif %}
    {%- endif %}
  {%- endif %}

  {%- if cookiecutter.db_info.name == "postgresql" %}

  # Durable state: identity / business truth. Persist via named volume.
  db:
    image: {{cookiecutter.db_info.image}}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-{{cookiecutter.project_name}}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-{{cookiecutter.project_name}}}
      POSTGRES_DB: ${DB_NAME:-{{cookiecutter.project_name}}}
    volumes:
      - {{cookiecutter.project_name}}-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 40
    networks:
      - app
  {%- endif %}

  {%- if cookiecutter.db_info.name == "mongodb"%}

  # Durable state: document identity / business truth.
  db:
    image: {{cookiecutter.db_info.image}}
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-{{cookiecutter.project_name}}}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-{{cookiecutter.project_name}}}
    command: "mongod"
    volumes:
      - {{cookiecutter.project_name}}-db-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 40
    networks:
      - app
  {%- endif %}

  {%- if cookiecutter.db_info.name == "mysql" %}

  # Durable state: identity / business truth.
  db:
    image: {{cookiecutter.db_info.image}}
    restart: unless-stopped
    environment:
      MYSQL_USER: ${DB_USER:-{{cookiecutter.project_name}}}
      MYSQL_PASSWORD: ${DB_PASSWORD:-{{cookiecutter.project_name}}}
      MYSQL_DATABASE: ${DB_NAME:-{{cookiecutter.project_name}}}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-{{cookiecutter.project_name}}}
      MYSQL_HOST: "0.0.0.0"
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD
      interval: 10s
      timeout: 5s
      retries: 40
    volumes:
      - {{cookiecutter.project_name}}-db-data:/var/lib/mysql
    networks:
      - app
  {%- endif %}

  {%- if cookiecutter.enable_migrations == 'True' and cookiecutter.orm != 'psycopg' %}

  migrator:
    <<: *app-common
    restart: "no"
    build:
      context: .
      target: prod
      dockerfile: ./Dockerfile
    image: {{cookiecutter.project_name}}:{{"${" }}{{cookiecutter.project_name | upper }}_VERSION:-latest{{"}"}}
    environment:
      <<: *app-environment
    {%- if cookiecutter.orm in ['sqlalchemy', 'ormar'] %}
    command: alembic upgrade head
    {%- elif cookiecutter.orm == 'tortoise' %}
    command: aerich upgrade
    {%- elif cookiecutter.orm == 'piccolo' %}
    command: piccolo migrations forwards all
    {%- elif cookiecutter.orm == 'beanie' %}
    command: beanie migrate -db admin -uri mongodb://${DB_USER:-{{cookiecutter.project_name}}}:${DB_PASSWORD:-{{cookiecutter.project_name}}}@db:27017/ -p {{cookiecutter.project_name}}/db/migrations/
    {%- endif %}
    {%- if cookiecutter.db_info.name != "sqlite" %}
    depends_on:
      db:
        condition: service_healthy
    {%- endif %}
  {%- endif %}

  {%- if cookiecutter.enable_redis == "True" %}

  # Ephemeral / distributed state by default (no volume = data lost on recreate).
  # Add a volume + AOF/RDB only if Redis is authoritative for sessions/idempotency.
  redis:
    image: redis:8.4.0
    restart: unless-stopped
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    healthcheck:
      test: redis-cli ping
      interval: 1s
      timeout: 3s
      retries: 50
    networks:
      - app
  {%- endif %}

  {%- if cookiecutter.enable_rmq == "True" %}

  # Async workloads. guest/guest is a local bootstrap default — set RABBITMQ_* in prod.
  rmq:
    image: rabbitmq:4.2.1-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: "/"
    healthcheck:
      test: rabbitmq-diagnostics check_running -q
      interval: 3s
      timeout: 3s
      retries: 50
    networks:
      - app
  {%- endif %}

  {%- if cookiecutter.enable_kafka == "True" %}

  # Async / event bus. Plaintext for template/dev; production needs TLS/SASL.
  kafka:
    image: apache/kafka:4.1.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - app
  {%- endif %}

  {%- if cookiecutter.enable_nats == "True" %}

  # Async / event bus. Plaintext for template/dev; production needs auth/TLS.
  nats:
    image: nats:2.12-alpine
    restart: unless-stopped
    command: -m 8222 -js
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - "wget http://localhost:8222/healthz -q -O - | xargs | grep ok || exit 1"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks:
      - app
  {%- endif %}

networks:
  app:
    name: {{cookiecutter.project_name}}-app
    driver: bridge
  {%- if cookiecutter.traefik_labels == "True" %}
  # Attach Traefik (run separately) to this network; do not publish DB/broker ports.
  traefik-shared:
    name: traefik-shared
  {%- endif %}

{% if cookiecutter.db_info.name != 'none' %}
volumes:
  {{cookiecutter.project_name}}-db-data:
    name: {{cookiecutter.project_name}}-db-data
{%- endif %}
