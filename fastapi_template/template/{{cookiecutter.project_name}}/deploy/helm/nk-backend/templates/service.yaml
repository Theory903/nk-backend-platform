apiVersion: v1
kind: Service
metadata:
  name: {{ include "nk-backend.fullname" . }}-api
  labels:
    {{- include "nk-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: {{ include "nk-backend.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.stream.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nk-backend.fullname" . }}-stream
spec:
  selector:
    app.kubernetes.io/name: {{ include "nk-backend.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: stream
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- end }}
