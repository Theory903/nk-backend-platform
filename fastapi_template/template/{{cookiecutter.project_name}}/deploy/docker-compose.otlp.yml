services:
  api:
    environment:
      {{ cookiecutter.project_name | upper }}_OPENTELEMETRY_ENDPOINT: "http://otel-collector:4317"
      {%- if cookiecutter.add_users in [True, "True", "true", 1, "1"] %}
      {{ cookiecutter.project_name | upper }}_METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:?Set METRICS_AUTH_TOKEN}
      {%- endif %}
    depends_on:
      otel-collector:
        condition: service_started

  {%- if cookiecutter.enable_taskiq in [True, "True", "true", 1, "1"] %}
  taskiq-worker:
    environment:
      {{ cookiecutter.project_name | upper }}_OPENTELEMETRY_ENDPOINT: "http://otel-collector:4317"
    depends_on:
      otel-collector:
        condition: service_started
  {%- endif %}

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0@sha256:e39311df1f3d941923c00da79ac7ba6269124a870ee87e3c3ad24d60f8aee4d2
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - app
      - observability
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.2.1@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --config.expand-env=true
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus-rules.yml:/etc/prometheus/rules/service.yml:ro
      - prometheus-data:/prometheus
    networks:
      - app
      - observability
    {%- if cookiecutter.add_users in [True, "True", "true", 1, "1"] %}
    environment:
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:?Set METRICS_AUTH_TOKEN}
    {%- endif %}
    depends_on:
      api:
        condition: service_started
      otel-collector:
        condition: service_started

  loki:
    image: grafana/loki:3.4.2@sha256:58a6c186ce78ba04d58bfe2a927eff296ba733a430df09645d56cdc158f3ba08
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yaml
      - -config.expand-env=true
    volumes:
      - ./deploy/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks:
      - observability

  tempo:
    image: grafana/tempo:2.7.2@sha256:4b0277a9b572a4b1fa43b01468e58911ec214dd69d033f2cd476596d14de9fe3
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo/config.yaml
      - -config.expand-env=true
    volumes:
      - ./deploy/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - observability

  grafana:
    image: grafana/grafana:11.5.2@sha256:8b37a2f028f164ce7b9889e1765b9d6ee23fec80f871d156fbf436d6198d32b7
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:${NK_GRAFANA_PORT:-${GRAFANA_PORT:-3000}}}
    ports:
      - "127.0.0.1:${NK_GRAFANA_PORT:-${GRAFANA_PORT:-3000}}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  app:
    name: {{ "${" }}COMPOSE_PROJECT_NAME:-{{cookiecutter.project_name}}{{ "}" }}-app
  observability:
    name: {{ "${" }}COMPOSE_PROJECT_NAME:-{{cookiecutter.project_name}}{{ "}" }}-observability

volumes:
  prometheus-data:
    name: {{ "${" }}COMPOSE_PROJECT_NAME:-{{cookiecutter.project_name}}{{ "}" }}-prometheus-data
  loki-data:
    name: {{ "${" }}COMPOSE_PROJECT_NAME:-{{cookiecutter.project_name}}{{ "}" }}-loki-data
  tempo-data:
    name: {{ "${" }}COMPOSE_PROJECT_NAME:-{{cookiecutter.project_name}}{{ "}" }}-tempo-data
  grafana-data:
    name: {{ "${" }}COMPOSE_PROJECT_NAME:-{{cookiecutter.project_name}}{{ "}" }}-grafana-data
