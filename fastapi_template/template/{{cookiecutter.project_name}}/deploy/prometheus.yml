global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
{%- if cookiecutter.prometheus_enabled in [True, "True", "true", 1, "1"] %}
  - job_name: "{{cookiecutter.project_name}}-api"
    metrics_path: /api/metrics
    {%- if cookiecutter.add_users in [True, "True", "true", 1, "1"] %}
    authorization:
      type: Bearer
      credentials: ${METRICS_AUTH_TOKEN}
    {%- endif %}
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "{{cookiecutter.project_name}}"
          role: "api"
          environment: "production"
{%- endif %}

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
