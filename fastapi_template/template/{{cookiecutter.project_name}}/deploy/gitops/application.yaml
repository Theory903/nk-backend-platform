apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ cookiecutter.project_name }}
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://example.invalid/{{ cookiecutter.project_name }}.git
    targetRevision: main
    path: deploy/helm/nk-backend
    helm:
      values: |
        scale:
          stage: S1
        image:
          tag: staging
  destination:
    server: https://kubernetes.default.svc
    namespace: nk
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
