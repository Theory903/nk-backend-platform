# Development overlay — reload, source mount, and host ports for local tools.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Host ports are intentional here so IDEs/CLIs can reach db/redis/brokers.
# Do not use this file as a production topology.

services:
  api:
    build:
      target: dev
    environment:
      {{cookiecutter.project_name | upper}}_RELOAD: "True"
      {{cookiecutter.project_name | upper}}_ENVIRONMENT: "dev"
    ports:
      - "8000:8000"
    volumes:
      - .:/app/src/
      # Keep the Docker-built React bundle visible through the source mount.
      - /app/src/{{cookiecutter.project_name}}/static/studio/dist
      {%- if cookiecutter.db_info.name == "sqlite" %}
      - {{cookiecutter.project_name}}-db-data:/db_data/
      {%- endif %}

  {%- if cookiecutter.enable_taskiq == "True" %}

  taskiq-worker:
    build:
      target: dev
    environment:
      {{cookiecutter.project_name | upper}}_RELOAD: "True"
      {{cookiecutter.project_name | upper}}_ENVIRONMENT: "dev"
    volumes:
      - .:/app/src/
    command:
      - taskiq
      - worker
      - {{cookiecutter.project_name}}.tkq:broker
      - --reload
  {%- endif %}

  {%- if cookiecutter.enable_migrations == 'True' and cookiecutter.orm != 'psycopg' %}

  migrator:
    build:
      target: dev
    volumes:
      - .:/app/src/
  {%- endif %}

  {%- if cookiecutter.db_info.name == "postgresql" %}

  db:
    ports:
      - "{{cookiecutter.db_info.port}}:{{cookiecutter.db_info.port}}"
  {%- endif %}

  {%- if cookiecutter.db_info.name == "mongodb" %}

  db:
    ports:
      - "{{cookiecutter.db_info.port}}:{{cookiecutter.db_info.port}}"
  {%- endif %}

  {%- if cookiecutter.db_info.name == "mysql" %}

  db:
    ports:
      - "{{cookiecutter.db_info.port}}:{{cookiecutter.db_info.port}}"
  {%- endif %}

  {%- if cookiecutter.enable_redis == "True" %}

  redis:
    ports:
      - "6379:6379"
  {%- endif %}

  {%- if cookiecutter.enable_rmq == "True" %}

  # guest/guest is acceptable for local-only RabbitMQ; override via RABBITMQ_* for shared envs.
  rmq:
    ports:
      - "5672:5672"
      - "15672:15672"
  {%- endif %}

  {%- if cookiecutter.enable_kafka == "True" %}

  kafka:
    ports:
      - "9094:9094"
    environment:
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT"
  {%- endif %}

  {%- if cookiecutter.enable_nats == "True" %}

  nats:
    ports:
      - "4222:4222"
  {%- endif %}
